# RayliIstanbul iOS projesi. Xcode projesi bu dosyadan XcodeGen ile üretilir (GitHub Actions'ta).
# Ortak kabuk: ios/Shell. Uygulamanın kendisi Android'deki ile aynı sayfa; ios/hazirla.sh site klasörünü hazırlar.
name: RayliIstanbul
options:
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  RayliIstanbul:
    type: application
    platform: iOS
    sources:
      - path: Shell
      - path: RayliIstanbul/Assets.xcassets
      - path: gen/RayliIstanbul/site
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.maelstoorm.metroistanbul
        PRODUCT_NAME: RayliIstanbul
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) SHELL_NO_LOCATION
        INFOPLIST_FILE: RayliIstanbul/Info.plist
    info:
      path: RayliIstanbul/Info.plist
      properties: {"CFBundleDisplayName": "Raylı İstanbul", "CFBundleShortVersionString": "$(MARKETING_VERSION)", "CFBundleVersion": "$(CURRENT_PROJECT_VERSION)", "CFBundleDevelopmentRegion": "tr", "LSRequiresIPhoneOS": true, "ITSAppUsesNonExemptEncryption": false, "UIRequiresFullScreen": true, "UIStatusBarStyle": "UIStatusBarStyleLightContent", "UIViewControllerBasedStatusBarAppearance": true, "UISupportedInterfaceOrientations": ["UIInterfaceOrientationPortrait"], "UILaunchScreen": {"UIColorName": "LaunchBg"}, "UIApplicationSceneManifest": {"UIApplicationSupportsMultipleScenes": false, "UISceneConfigurations": {"UIWindowSceneSessionRoleApplication": [{"UISceneConfigurationName": "Default", "UISceneDelegateClassName": "$(PRODUCT_MODULE_NAME).SceneDelegate"}]}}, "Shell": {"Background": "#0E1F2A", "LightStatusBar": true, "Orientation": "portrait"}}
